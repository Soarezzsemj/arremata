server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Repassa as chamadas /api para o container da API
  location /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Sem buffering e com timeout longo para o tempo real (SSE) funcionar:
    # o nginx precisa mandar cada evento na hora e não fechar conexões paradas.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Fallback de SPA: qualquer rota do React devolve o index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
